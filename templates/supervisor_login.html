<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso do supervisor</title><style>body{font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#172033}.box{width:min(390px,calc(100% - 32px));background:white;border-radius:18px;padding:32px;box-shadow:0 14px 40px #0f172a22}h1{font-size:24px;margin:0 0 8px}p{color:#526072}label,input{display:block;width:100%;box-sizing:border-box}label{margin-top:18px;font-weight:600}input{margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:8px;background:#0f766e;color:white;font:600 16px system-ui}.erro{color:#b42318}</style><main class="box"><h1>🧭 Painel do Supervisor</h1><p>Operação Milone</p>{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}<form method="post"><label>Usuário<input name="usuario" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></main>
