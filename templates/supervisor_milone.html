<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Supervisor · Milone</title><style>
:root{font-family:system-ui;color:#172033;background:#f5f7fb}body{margin:0}.top{padding:18px 5%;background:#102a43;color:white;display:flex;gap:16px;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.top small{color:#cbd5e1}.top button{background:transparent;color:white;border:1px solid #93a4b8;border-radius:7px;padding:7px 10px}.wrap{max-width:1320px;margin:auto;padding:22px}.notice{background:#fff7e5;border:1px solid #f2c467;padding:10px 14px;border-radius:9px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:white;border:1px solid #dde5ef;border-radius:12px;padding:16px;cursor:pointer}.card.active{outline:3px solid #14b8a6}.card h2{font-size:15px;margin:0 0 12px}.big{font-size:28px;font-weight:700}.muted{color:#64748b;font-size:13px}.filters{margin:20px 0;display:flex;gap:10px;flex-wrap:wrap}.filters input,.filters select{padding:9px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.filters label{display:flex;gap:5px;align-items:center;font-size:14px}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #e6edf5;font-size:14px}th{color:#526072;background:#f8fafc}.risk{background:#fff1f2}.hot{background:#fffbeb}.tag{font-size:12px;border-radius:12px;padding:3px 7px;background:#eef2ff;display:inline-block;margin:2px}.danger{background:#fee2e2;color:#991b1b}.money{background:#dcfce7;color:#166534}.orange{color:#c2410c;font-weight:700}.red{color:#b42318;font-weight:700}button.action{padding:7px 9px;border:1px solid #cbd5e1;background:white;border-radius:7px;cursor:pointer}.drawer{position:fixed;right:0;top:0;width:min(550px,100%);height:100%;background:#fff;box-shadow:-8px 0 30px #0003;padding:20px;box-sizing:border-box;overflow:auto;display:none}.drawer.open{display:block}.msg{margin:10px 0;padding:9px 11px;border-radius:8px;background:#f1f5f9;white-space:pre-wrap}.msg.client{background:#e0f2fe}.msg.private{background:#fef3c7}.msg small{display:block;color:#64748b;margin-bottom:4px}@media(max-width:720px){.wrap{padding:14px}table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{padding:12px;border-bottom:7px solid #f5f7fb}td{border:0;padding:4px 0}td:before{content:attr(data-l);display:block;color:#64748b;font-size:12px}.top{padding:14px}.filters input{width:100%}}</style>
<header class="top"><div><h1>🧭 Painel do Supervisor · Milone</h1><small id="atualizado">Carregando…</small></div><form method="post" action="/supervisor/sair"><button>Sair</button></form></header><main class="wrap">{% if somente_leitura %}<div class="notice">Modo de teste: visualização somente. Atribuição e notas serão liberadas depois da validação.</div>{% endif %}<section id="cards" class="cards"></section><section class="filters"><select id="responsavel"><option value="todos">Todos</option><option value="sem">Sem atribuição</option></select><label><input type="checkbox" id="esperando"> Só esperando</label><label><input type="checkbox" id="dados"> Só 💰</label><label><input type="checkbox" id="risco"> Só ⚠️</label><input id="busca" placeholder="Buscar nome ou telefone"></section><table><thead><tr><th></th><th>Cliente</th><th>Com quem</th><th>Esperando</th><th>Janela</th><th>Última mensagem</th><th></th></tr></thead><tbody id="linhas"></tbody></table></main><aside id="gaveta" class="drawer"><button class="action" onclick="fechar()">Fechar</button><div id="detalhe"></div></aside><script>
let dados=[],agentes={},filtro='todos';const $=x=>document.getElementById(x);const t=s=>s==null?'—':s<0?'Fechada':s<3600?Math.floor(s/60)+'min':Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'min';const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function render(){const q=$('busca').value.toLowerCase();const resp=$('responsavel').value;const rows=dados.filter(x=>(filtro==='todos'||(filtro==='sem'?!x.assignee_id:String(x.assignee_id)===filtro))&&(resp==='todos'||(resp==='sem'?!x.assignee_id:String(x.assignee_id)===resp))&&(!$('esperando').checked||x.espera_segundos!==null)&&(!$('dados').checked||x.dados_enviados)&&(!$('risco').checked||x.risco)&&((x.nome+' '+x.telefone).toLowerCase().includes(q)));$('linhas').innerHTML=rows.map(x=>`<tr class="${x.risco?'risk':x.sem_resposta>=3?'hot':''}"><td data-l="Alertas">${x.risco?'<span class="tag danger">⚠️ risco</span>':''}${x.dados_enviados?'<span class="tag money">💰 dados</span>':''}</td><td data-l="Cliente"><b>${esc(x.nome)}</b><br><span class="muted">${esc(x.telefone)}</span></td><td data-l="Com quem">${esc(x.assignee_nome)}</td><td data-l="Esperando" class="${x.espera_segundos>3600?'red':x.espera_segundos>900?'orange':''}">${t(x.espera_segundos)}${x.sem_resposta>=2?' · 🗨️ '+x.sem_resposta:''}</td><td data-l="Janela" class="${x.janela_segundos<7200?'red':''}">${t(x.janela_segundos)}</td><td data-l="Última mensagem">${esc(x.ultima_mensagem)}</td><td><button class="action" onclick="abrir(${x.id})">Ver conversa</button></td></tr>`).join('')||'<tr><td colspan="7">Nenhuma conversa neste filtro.</td></tr>'}
function cards(c){agentes=c;let h=`<article class="card ${filtro==='sem'?'active':''}" onclick="filtro='sem';render()"><h2>SEM ATRIBUIÇÃO</h2><div class="big">${c.sem_atribuicao.abertas}</div><span class="muted">${c.sem_atribuicao.esperando} esperando</span></article>`;for(const [id,x] of Object.entries(c)){if(id==='sem_atribuicao')continue;h+=`<article class="card ${filtro===id?'active':''}" onclick="filtro='${id}';render()"><h2>${esc(x.nome)} ${x.status==='online'?'🟢':'🔴'}</h2><div class="big">${x.abertas}</div><span class="muted">${x.esperando} esperando · ${x.sem_contato} sem contato</span></article>`}$('cards').innerHTML=h;$('responsavel').innerHTML='<option value="todos">Todos</option><option value="sem">Sem atribuição</option>'+Object.entries(c).filter(([id])=>id!=='sem_atribuicao').map(([id,x])=>`<option value="${id}">${esc(x.nome)}</option>`).join('')}
async function carregar(){try{const r=await fetch('/api/supervisor/painel');if(!r.ok)throw Error();const d=await r.json();dados=d.conversas;cards(d.cards);render();$('atualizado').textContent='Atualizado agora';setTimeout(()=>{$('atualizado').textContent='atualizado há 30s'},30000)}catch(e){$('atualizado').textContent='Não foi possível atualizar agora'}}
async function abrir(id){const r=await fetch('/api/supervisor/conversas/'+id);if(!r.ok)return;const d=await r.json(),x=d.conversa;$('detalhe').innerHTML=`<h2>${esc(x.nome)}</h2><p>${esc(x.telefone)} · ${esc(x.assignee_nome)}<br>Caixa: ${esc(d.inbox)}</p><h3>Mensagens</h3>`+x._mensagens.map(m=>`<div class="msg ${m.private?'private':m.message_type===0?'client':''}"><small>${m.private?'Nota interna':m.message_type===0?'Cliente':'Equipe'} · ${new Date((m.created_at||0)*1000).toLocaleString('pt-BR')}</small>${esc(m.content||((m.attachments||[]).length?'[mídia]':''))}</div>`).join('');$('gaveta').classList.add('open')}function fechar(){$('gaveta').classList.remove('open')}for(const id of ['responsavel','esperando','dados','risco','busca'])$(id).addEventListener(id==='busca'?'input':'change',render);carregar();setInterval(carregar,60000);
</script>
